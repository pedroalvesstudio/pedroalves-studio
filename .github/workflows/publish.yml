name: Validate and publish PedroAlves Studio

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'projetos/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify homepage and project pages
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          for project in fynora videfo zarion althor norte nexora mooni; do
            test -s "projetos/$project/index.html"
          done
          test -s projetos/mooni/assets/kodara-original.css
          test -s projetos/mooni/assets/kodara-icon.svg
          grep -q "kodara" projetos/mooni/index.html
          grep -q "Desarrollo más inteligente" projetos/mooni/index.html
          grep -q "fb-carousel" projetos/mooni/index.html
          grep -q "w-tab-link" projetos/mooni/index.html
          grep -q "w-slider" projetos/mooni/index.html
          echo "Homepage and all seven project pages verified, including Kodara and original interactions."

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          cp -R projetos site/projetos
      - name: Publish static assets to the existing Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets ./site --name pedroalves-studio --compatibility-date 2026-11-17
