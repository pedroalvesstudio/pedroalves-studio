name: Validate and publish PedroAlves Studio

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '_redirects'
      - 'projetos/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify homepage and project pages
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          for project in aurenta kodara latera nexora-ai thaise paynex; do
            test -s "projetos/$project/index.html"
          done
          test -s projetos/kodara/assets/kodara-original.css
          test -s projetos/kodara/assets/kodara-icon.svg
          test -s projetos/thaise/assets/thaise-hero-cutout.webp
          file projetos/thaise/assets/thaise-hero-cutout.webp | grep -qi webp
          grep -q "kodara" projetos/kodara/index.html
          grep -q "Desarrollo más inteligente" projetos/kodara/index.html
          grep -q "fb-carousel" projetos/kodara/index.html
          grep -q "w-tab-link" projetos/kodara/index.html
          grep -q "w-slider" projetos/kodara/index.html
          echo "Homepage and all six official project pages verified, including Kodara and original interactions."

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          cp _redirects site/_redirects
          cp -R projetos site/projetos
      - name: Publish static assets to the existing Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets ./site --name pedroalves-studio --compatibility-date 2026-11-17
      - name: Verify deployed Thaíse portrait asset
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          for attempt in {1..10}; do
            if curl -fsS "https://pedroalves-studio.pedroalves2-esp.workers.dev/projetos/thaise/assets/thaise-hero-cutout.webp" -o /tmp/thaise.webp; then
              python - <<'PY'
          from PIL import Image
          im = Image.open("/tmp/thaise.webp").convert("RGBA")
          alpha = im.getchannel("A")
          print("Deployed portrait:", im.size, "visible alpha bbox:", alpha.getbbox())
          assert im.width >= 300 and im.height >= 300, "Portrait dimensions are unexpectedly small"
          assert alpha.getbbox() is not None, "Portrait is fully transparent"
          assert alpha.getextrema()[1] > 0, "Portrait has no visible pixels"
          PY
              exit 0
            fi
            sleep 5
          done
          echo "Thaíse portrait asset could not be downloaded from the deployed site." >&2
          exit 1
# Trigger publish after approved PayNex brand update.
