name: Build Kodara from original Mooni
on:
  push:
    paths:
      - scripts/build_kodara.py
      - .github/workflows/build-kodara.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser
        run: pip install beautifulsoup4
      - name: Recreate original structure and interactions with custom identity
        run: python scripts/build_kodara.py
      - name: Commit page and stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projetos/mooni/index.html projetos/mooni/assets/kodara-original.css projetos/mooni/assets/kodara-icon.svg
          git diff --cached --quiet || (git commit -m "Publish Kodara with original Mooni components, motion and Spanish text" && git push)
