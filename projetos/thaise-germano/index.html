<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Thaíse Germano — Página de Vendas | PedroAlves Studio</title>
<meta name="description" content="Projeto de página de vendas para Thaíse Germano, desenvolvido por PedroAlves Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;background:#090909}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090909}
.hero{width:100%;aspect-ratio:1400/780;overflow:hidden;background:#090909}
.hero-art{display:block;width:100%;height:100%;object-fit:cover;object-position:top center;animation:hero-arrive 1.1s ease-out both}
@keyframes hero-arrive{from{opacity:.75;transform:scale(1.018)}to{opacity:1;transform:scale(1)}}
@media(max-width:600px){.hero{aspect-ratio:1400/900}}
@media(prefers-reduced-motion:reduce){.hero-art{animation:none}}
</style>
</head>
<body>
<main id="top">
<section class="hero" aria-label="Primeira seção original da página de vendas Thaíse Germano">
  <img class="hero-art" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/c0f081244966899.69a3041326cba.png" alt="Hero original da página de vendas Thaíse Germano, com navegação, apresentação da contadora e chamada para ação" fetchpriority="high">
</section>
</main>
</body>
</html>
