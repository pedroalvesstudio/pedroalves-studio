<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Thaíse Germano — Nova direção visual | PedroAlves Studio</title>
<style>
:root{color-scheme:dark;--black:#080808;--red:#a90012;--red-hot:#e10d20}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black)}
body{min-height:100vh;overflow-x:hidden}
.background-stage{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;background:
 radial-gradient(ellipse 58% 74% at -8% 88%,rgba(174,0,18,.46) 0%,rgba(112,0,12,.22) 34%,transparent 72%),
 radial-gradient(ellipse 40% 54% at 93% 18%,rgba(94,13,17,.26) 0%,rgba(65,8,12,.12) 42%,transparent 76%),
 radial-gradient(ellipse 28% 34% at 52% 108%,rgba(93,0,10,.16),transparent 76%),
 #080808}
.background-stage:before,.background-stage:after{content:"";position:absolute;pointer-events:none;inset:-12%;z-index:-1}
.background-stage:before{background:
 radial-gradient(ellipse 28% 17% at 8% 46%,rgba(214,0,24,.15),transparent 72%),
 radial-gradient(ellipse 21% 15% at 88% 76%,rgba(172,0,18,.13),transparent 75%);
 filter:blur(48px);opacity:.9;animation:ambient-drift 18s ease-in-out infinite alternate}
.background-stage:after{inset:0;z-index:0;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
.light-beam{position:absolute;z-index:0;pointer-events:none;width:38vw;height:2px;left:-8vw;top:18%;background:linear-gradient(90deg,transparent,rgba(239,20,35,.65),transparent);filter:blur(5px);box-shadow:0 0 22px 5px rgba(194,0,20,.16);opacity:.7}
.light-orb{position:absolute;z-index:0;pointer-events:none;border-radius:50%;filter:blur(72px);mix-blend-mode:screen}
.light-orb.one{width:32vw;height:32vw;left:-19vw;bottom:-17vw;background:rgba(192,0,22,.24)}
.light-orb.two{width:22vw;height:22vw;right:-12vw;top:20%;background:rgba(119,0,15,.18)}
@keyframes ambient-drift{0%{transform:translate3d(-1.5%,0,0) scale(1)}100%{transform:translate3d(2%,1.5%,0) scale(1.06)}}
@media(max-width:700px){
 .background-stage{min-height:100svh;background:
 radial-gradient(ellipse 95% 48% at -18% 90%,rgba(174,0,18,.4),transparent 72%),
 radial-gradient(ellipse 78% 42% at 100% 24%,rgba(94,13,17,.2),transparent 75%),#080808}
 .background-stage:before{filter:blur(38px);opacity:.8}
 .light-beam{width:70vw;top:22%;opacity:.55}
 .light-orb.one{width:68vw;height:68vw;left:-40vw;bottom:-20vw}
 .light-orb.two{width:45vw;height:45vw;right:-28vw;top:25%}
}
@media(prefers-reduced-motion:reduce){.background-stage:before{animation:none}}

/* Header / menu — approved background remains untouched */
.site-header{position:absolute;z-index:5;top:30px;left:50%;transform:translateX(-50%);width:min(92%,1180px);height:62px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(9,9,9,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 34px rgba(0,0,0,.18);animation:menu-enter .8s .1s both}
.site-brand{display:inline-flex;align-items:center;justify-content:center;height:100%;min-width:54px;color:#e10d20;text-decoration:none;font:800 35px/.9 "DM Sans",sans-serif;letter-spacing:-.12em;transform:translateY(-1px)}
.site-nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(20px,2.7vw,38px)}
.site-nav a,.studio-home{color:rgba(245,239,237,.76);text-decoration:none;font:500 9px/1 "DM Sans",sans-serif;letter-spacing:.09em;transition:color .2s ease}
.site-nav a:hover,.studio-home:hover{color:#fff}
.studio-home{white-space:nowrap}
.menu-toggle{display:none;width:38px;height:38px;padding:0;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(255,255,255,.04);color:#f5efed;cursor:pointer}
.menu-toggle svg{width:17px;height:17px}
@keyframes menu-enter{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:700px){
 .site-header{top:14px;width:calc(100% - 28px);height:54px;padding:0 16px;border-radius:10px}
 .site-brand{font-size:30px;min-width:52px}
 .studio-home{display:none}
 .menu-toggle{display:inline-flex}
 .site-nav{display:none;position:absolute;left:0;right:0;top:calc(100% + 9px);transform:none;padding:16px;border:1px solid rgba(255,255,255,.13);border-radius:10px;background:rgba(9,9,9,.94);backdrop-filter:blur(18px);flex-direction:column;align-items:stretch;gap:0;box-shadow:0 16px 36px rgba(0,0,0,.35)}
 .site-nav.is-open{display:flex}
 .site-nav a{padding:14px 5px;font-size:10px;border-bottom:1px solid rgba(255,255,255,.08)}
 .site-nav a:last-child{border-bottom:0}
}
@media(prefers-reduced-motion:reduce){.site-header{animation:none}}


/* Hero portrait stage — independent image layer */
.hero-stage{position:relative;z-index:1;min-height:calc(100svh - 92px);width:min(1180px,92%);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:70px 0 34px}
.hero-portrait{position:absolute;z-index:-1;right:-2%;bottom:0;width:min(58%,700px);height:88%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.hero-portrait:before{content:"";position:absolute;inset:10% -12% 0 2%;background:radial-gradient(ellipse at 52% 55%,rgba(198,0,24,.38),rgba(122,0,15,.19) 42%,transparent 72%);filter:blur(38px);animation:portrait-glow 8s ease-in-out infinite alternate}
.hero-portrait img{position:relative;width:100%;height:100%;object-fit:cover;object-position:center 25%;mask-image:linear-gradient(to bottom,#000 0%,#000 78%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 78%,transparent 100%);filter:contrast(1.03) saturate(.88);animation:portrait-enter 1.15s cubic-bezier(.2,.7,.2,1) both}
@keyframes portrait-enter{from{opacity:0;transform:translate3d(28px,18px,0) scale(1.025)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes portrait-glow{from{opacity:.55;transform:scale(.94)}to{opacity:1;transform:scale(1.08)}}
@media(max-width:700px){
 .hero-stage{width:100%;min-height:calc(100svh - 70px);display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;padding:80px 22px 34px}
 .hero-portrait{right:-12%;bottom:auto;top:58px;width:100%;height:58%;opacity:.92}
 .hero-portrait:before{inset:12% -10% 0;background:radial-gradient(ellipse,rgba(198,0,24,.34),transparent 70%);filter:blur(30px)}
 .hero-portrait img{object-position:center 22%;mask-image:linear-gradient(to bottom,#000 0%,#000 68%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 68%,transparent 100%)}
}
@media(prefers-reduced-motion:reduce){.hero-portrait img,.hero-portrait:before{animation:none}}

</style>
</head>
<body>

<header class="site-header">
<a class="site-brand" href="#inicio" aria-label="Thaíse Germano">ce</a>
<nav class="site-nav" id="site-nav" aria-label="Navegação principal">
<a href="#sobre">SOBRE</a><a href="#solucoes">SOLUÇÕES</a><a href="#casos">CASOS DE SUCESSO</a><a href="#contato">CONTATO</a>
</nav>
<a class="studio-home" href="/">PEDROALVES STUDIO ↗</a>
<button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="site-nav">
<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
</button>
</header>

<main class="background-stage" id="inicio" aria-label="Estudo de fundo visual dark com iluminação vermelha">
<section class="hero-stage" id="hero" aria-label="Apresentação da mentoria Contadora Elite">
<div class="hero-portrait"><img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=1200&auto=format&fit=crop&q=85" alt="Retrato profissional de uma mulher com blazer escuro" fetchpriority="high"></div>
</section>
<div class="light-beam"></div><div class="light-orb one"></div><div class="light-orb two"></div>
</main>
<script>
(()=>{const b=document.querySelector(".menu-toggle"),n=document.querySelector(".site-nav");if(!b||!n)return;b.addEventListener("click",()=>{const open=b.getAttribute("aria-expanded")!=="true";b.setAttribute("aria-expanded",String(open));b.setAttribute("aria-label",open?"Fechar menu":"Abrir menu");n.classList.toggle("is-open",open)});n.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{n.classList.remove("is-open");b.setAttribute("aria-expanded","false");b.setAttribute("aria-label","Abrir menu")}));})();
</script>
</body>
</html>
