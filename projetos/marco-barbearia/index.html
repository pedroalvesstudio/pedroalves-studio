<!doctype html>
<html lang="pt-BR">
<head>

<title>Marco Barbearia — Muito além de cabelo e barba</title>

<style>
:root{--bg:#080909;--panel:#0e1010;--panel2:#121414;--text:#f4f4ef;--muted:#a5a7a0;--line:#ffffff12;--yellow:#f1ed00;--yellow2:#d8d500;--red:#a80008;--max:1240px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}button{font:inherit}img{display:block;max-width:100%}.shell{width:min(var(--max),calc(100% - 64px));margin:auto}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--yellow);font-weight:700}.accent{color:var(--yellow)}.section-title{font:500 clamp(25px,3vw,38px)/1.15 Manrope,sans-serif;letter-spacing:-.045em;margin:0}.section-copy{max-width:420px;color:var(--muted);font-size:13px;line-height:1.65}.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:11px 17px;border:0;border-radius:99px;background:var(--yellow);color:#080909;font-size:10px;font-weight:800;transition:transform .25s,box-shadow .25s,background .25s;cursor:pointer}.btn:hover{transform:translateY(-3px);box-shadow:0 8px 28px #f1ed0033;background:#fff900}.btn .arrow{display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#101111;color:var(--yellow);font-size:12px}.site-header{height:66px;position:absolute;z-index:20;inset:0 0 auto;border-bottom:1px solid #ffffff12;background:#080909ad;backdrop-filter:blur(15px)}.header-inner{height:100%;width:min(var(--max),calc(100% - 64px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:7px;font:800 15px/1 Manrope;letter-spacing:-.08em}.brand-mark{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#090a09;font-size:9px;letter-spacing:-.1em;box-shadow:0 0 22px #f1ed0033}.brand span:last-child{font-size:8px;letter-spacing:.06em;font-weight:600;color:#d8d8d0;margin-left:-4px}.nav{display:flex;align-items:center;gap:30px}.nav a{font-size:10px;color:#ddd;font-weight:600;transition:color .2s}.nav a:hover{color:var(--yellow)}.header-cta{font-size:9px;padding:10px 18px;border:1px solid #ffffff30;border-radius:99px;color:#eee}.menu-toggle{display:none;background:none;border:1px solid #ffffff30;border-radius:50%;width:38px;height:38px;color:#fff;font-size:19px}
.hero{min-height:660px;height:min(820px,100svh);position:relative;display:flex;align-items:center;isolation:isolate;background:#151716}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#050606ed 0%,#050606b5 42%,#05060655 100%),linear-gradient(0deg,#080909 0%,transparent 35%,#08090966 100%)}

.hero-content{padding-top:70px;max-width:var(--max);width:calc(100% - 64px);margin:auto}.hero-kicker{display:flex;align-items:center;gap:12px;margin-bottom:25px;color:#d0d0c9;font-size:10px;letter-spacing:.22em;text-transform:uppercase}.hero-kicker:before{content:"";width:28px;height:1px;background:var(--yellow)}.hero h1{font:500 clamp(48px,7.4vw,96px)/.99 Manrope,sans-serif;letter-spacing:-.065em;max-width:680px;margin:0 0 24px}.hero h1 span{display:block;color:var(--yellow)}.hero-bottom{display:flex;align-items:end;justify-content:space-between;gap:25px}.hero-bottom p{max-width:360px;margin:0;color:#deded7;font-size:13px;line-height:1.65}.hero-bottom .btn{flex:none}
.section{padding:100px 0;position:relative}.section-head{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:35px}.section-head.center{display:block;text-align:center}.section-head.center .section-title{margin-top:12px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.service-card{min-height:260px;padding:26px 25px 22px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,#111313,#0b0d0d);display:flex;flex-direction:column;justify-content:space-between;transition:transform .35s,border-color .35s}.service-card:hover{transform:translateY(-6px);border-color:#f1ed0066}.service-top{display:flex;justify-content:space-between;align-items:center}.service-top small{color:#8c8e87;font-size:10px;letter-spacing:.16em}.service-card h3{font:500 25px Manrope;margin:0 0 12px;letter-spacing:-.04em}.service-card p{color:#b4b6ae;font-size:12px;line-height:1.65;max-width:290px;margin:0}.service-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:24px}.service-number{font:600 40px/.9 Manrope;color:var(--yellow);letter-spacing:-.06em}.service-bottom .btn{font-size:9px;padding:9px 13px}
.work-section{padding-top:30px}.work-heading{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:end;margin:0 auto 32px;width:min(760px,100%)}.work-heading .section-title{font-size:clamp(25px,3vw,34px)}.work-heading p{margin:0;color:#b5b6af;font-size:12px;line-height:1.6}.video-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.video-card{height:330px;position:relative;overflow:hidden;border-radius:17px;border:1px solid #ffffff18;background:#151717}.video-card img{width:100%;height:100%;object-fit:cover;filter:brightness(.66);transition:transform .6s,filter .4s}.video-card:hover img{transform:scale(1.06);filter:brightness(.85)}.video-card:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#050606d9)}.video-meta{position:absolute;z-index:2;top:13px;left:13px;right:13px;display:flex;justify-content:space-between;gap:8px;font-size:9px;color:#fff}.video-meta span:last-child{border:1px solid #ffffff55;border-radius:30px;padding:4px 8px}.play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#b00008;display:grid;place-items:center;box-shadow:0 8px 24px #0008}.play:after{content:"";margin-left:4px;border-left:17px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}.video-tag{position:absolute;z-index:3;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;border:1px solid #ffffff55;border-radius:30px;padding:6px 15px;color:#eee;font-size:9px;background:#1118}.center-cta{text-align:center;margin-top:32px}
.rings{height:78px;display:flex;justify-content:center;align-items:center;overflow:hidden;margin:10px auto 35px}.rings-track{display:flex;align-items:center;animation:ring-drift 22s linear infinite}.rings i{width:43px;height:43px;border:1px solid #b8b9b0;border-radius:50%;margin-left:-11px;display:block}.rings i:first-child{margin-left:0}@keyframes ring-drift{to{transform:translateX(-35px)}}
.team-section{padding-top:30px}.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.team-card{border:1px solid #ffffff0c;border-radius:9px;overflow:hidden;background:#0e1010;transition:transform .35s,border-color .35s}.team-card:hover{transform:translateY(-5px);border-color:#f1ed004d}.team-info{padding:15px 17px 12px}.team-info:before{content:"▣";display:block;color:var(--yellow);font-size:14px;margin-bottom:6px}.team-info h3{margin:0 0 4px;font:500 19px Manrope;letter-spacing:-.04em}.team-info p{margin:0;color:#9b9d95;font-size:10px}.team-info:after{content:"";display:block;width:28px;height:1px;background:var(--yellow);margin-top:10px}.team-card img{width:100%;height:220px;object-fit:cover;object-position:center 35%;background:#1a1c1b}
.clients-section{padding-top:90px}.clients-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.client-card{background:#101212;border:1px solid var(--line);border-radius:9px;overflow:hidden}.client-card img{width:100%;height:190px;object-fit:cover}.client-card .client-caption{padding:11px 12px 13px;text-align:center}.client-caption strong{display:block;font-size:10px;font-weight:600}.client-caption span{display:block;color:#9fa198;font-size:9px;margin-top:4px}
.story-section{padding-top:70px}.story-panel{width:min(900px,100%);margin:auto;padding:38px;display:grid;grid-template-columns:.9fr 1fr;gap:42px;align-items:center;background:#0d1010;border:1px solid #ffffff0b;border-radius:10px}.story-image{height:390px;border-radius:7px;overflow:hidden;background:#191b1b}.story-image img{width:100%;height:100%;object-fit:cover;object-position:center 25%}.story-copy h2{font:500 32px/1.08 Manrope;letter-spacing:-.05em;margin:0 0 20px}.story-copy p{font-size:11px;line-height:1.8;color:#b4b6af;margin:0 0 14px}.story-copy .btn{margin-top:10px}
.gallery-section{padding:55px 0 75px}.gallery-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.gallery-strip img{width:100%;height:220px;object-fit:cover;border-radius:8px}
.locations-section{padding:50px 0 90px}.locations-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.locations-wrap h2{font:500 clamp(35px,5vw,58px)/1.02 Manrope;letter-spacing:-.06em;margin:0}.location-list{display:grid;gap:25px}.location-item h3{font:600 19px Manrope;color:var(--yellow);margin:0 0 4px}.location-item p{margin:0 0 12px;color:#d2d3cd;font-size:12px}.location-item .btn{padding:8px 14px;font-size:9px}
.footer{border-top:1px solid #ffffff10;padding:24px 0 30px;color:#9b9d95;font-size:10px}.footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center}.footer a{color:#deded7}.footer a:hover{color:var(--yellow)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}.reveal.visible{opacity:1;transform:none}
@media(max-width:900px){.nav{gap:17px}.video-card{height:280px}.team-card img{height:190px}.client-card img{height:160px}.story-panel{gap:28px;padding:28px}.story-image{height:350px}}
@media(max-width:700px){.shell,.header-inner,.hero-content{width:calc(100% - 38px)}.site-header{height:60px}.brand{font-size:14px}.menu-toggle{display:grid;place-items:center}.nav{display:none;position:absolute;top:60px;left:0;right:0;padding:14px 20px 20px;background:#090a0af5;border-bottom:1px solid #ffffff18;flex-direction:column;align-items:stretch;gap:0}.nav.open{display:flex}.nav a{padding:13px 2px;border-bottom:1px solid #ffffff12;font-size:12px}.header-cta{display:none}.hero{height:760px;min-height:680px;max-height:92svh;align-items:end}.hero:before{background:linear-gradient(0deg,#080909 0%,#080909dd 22%,#08090940 72%,#08090988 100%)}.hero-photo{object-position:57% center}.hero-content{padding:0 0 65px}.hero-kicker{font-size:8px;margin-bottom:18px}.hero h1{font-size:clamp(45px,12vw,66px);max-width:450px;margin-bottom:18px}.hero-bottom{display:block}.hero-bottom p{font-size:12px;max-width:330px;margin-bottom:20px}.section{padding:70px 0}.section-head{display:block;margin-bottom:24px}.section-head .section-copy{margin-top:12px}.services{grid-template-columns:1fr;gap:11px}.service-card{min-height:225px;padding:23px}.service-card h3{font-size:23px}.work-section{padding-top:15px}.work-heading{grid-template-columns:1fr;gap:10px;margin-bottom:23px}.work-heading p{max-width:380px}.video-grid{grid-template-columns:repeat(2,1fr);gap:10px}.video-card{height:255px;border-radius:13px}.video-meta{font-size:8px;top:9px;left:9px;right:9px}.video-meta span:last-child{font-size:7px}.play{width:48px;height:48px}.play:after{border-left-width:14px;border-top-width:8px;border-bottom-width:8px}.video-tag{font-size:8px;bottom:12px;padding:5px 10px}.rings{height:62px;margin:10px auto 25px}.rings i{width:35px;height:35px}.team-grid{grid-template-columns:repeat(2,1fr);gap:10px}.team-info{padding:12px}.team-info h3{font-size:15px}.team-card img{height:175px}.clients-row{grid-template-columns:repeat(2,1fr);gap:10px}.client-card img{height:155px}.client-caption strong{font-size:9px}.story-panel{grid-template-columns:1fr;padding:17px;gap:22px}.story-image{height:340px}.story-copy{padding:0 5px 7px}.story-copy h2{font-size:29px}.gallery-section{padding:25px 0 55px}.gallery-strip{grid-template-columns:repeat(2,1fr);gap:8px}.gallery-strip img{height:160px}.locations-wrap{grid-template-columns:1fr;gap:30px}.locations-wrap h2{font-size:42px}.location-list{gap:22px}.footer-inner{align-items:flex-start;flex-direction:column;gap:10px}}
@media(max-width:380px){.video-card{height:225px}.team-card img{height:145px}.client-card img{height:130px}.hero h1{font-size:43px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rings-track{animation:none}.reveal{opacity:1;transform:none;transition:none}*{transition-duration:.01ms!important}}


/* Header matched to the user's supplied Marco Barbearia reference */
.site-header{height:68px;background:linear-gradient(105deg,rgba(5,8,8,.97) 0%,rgba(15,16,15,.94) 58%,rgba(40,39,34,.88) 100%);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.26)}
.header-inner{width:min(1120px,calc(100% - 64px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{position:relative;display:flex;align-items:center;justify-self:start;width:66px;height:43px;gap:0;letter-spacing:0}
.brand-mark{position:absolute;left:15px;top:3px;width:34px;height:34px;background:var(--yellow);border-radius:50%;box-shadow:none}
.brand-word{position:absolute;left:0;top:13px;width:66px;text-align:center;font:400 12px/1 Manrope,sans-serif;letter-spacing:3.4px;color:#f3f3ed;z-index:1}
.brand-sub{position:absolute;left:0;top:34px;width:66px;text-align:center;font:500 4px/1 Manrope,sans-serif;letter-spacing:1.6px;color:#a8aaa3}
.nav{justify-self:center;gap:39px}
.nav a{font:500 10px/1 "DM Sans",sans-serif;color:#f0f0eb;white-space:nowrap}
.header-cta{justify-self:end;display:inline-flex;align-items:center;gap:11px;padding:10px 23px;border:1px solid rgba(255,255,255,.24);border-radius:99px;background:rgba(255,255,255,.09);font:500 10px/1 "DM Sans",sans-serif;color:#eee;white-space:nowrap}
.header-cta:before{content:"";width:5px;height:5px;border:1px solid var(--yellow);border-radius:50%;display:block}
@media(max-width:900px){.nav{gap:20px}.header-inner{width:calc(100% - 42px)}}
@media(max-width:700px){.site-header{height:62px}.header-inner{width:calc(100% - 36px);grid-template-columns:1fr auto}.brand{transform:scale(.92);transform-origin:left center}.nav{display:none;position:absolute;top:62px;left:0;right:0;padding:12px 20px 18px;background:rgba(8,9,9,.98);border-bottom:1px solid #ffffff24;flex-direction:column;align-items:stretch;gap:0}.nav.open{display:flex}.nav a{padding:14px 2px;border-bottom:1px solid #ffffff13;font-size:12px}.menu-toggle{display:grid;place-items:center;grid-column:2;grid-row:1}.header-cta{display:none}}

</style>
</head>
<body>
<header class="site-header"><div class="header-inner">
<a class="brand" href="#inicio" aria-label="Marco Barbearia início"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">MARCO</span><span class="brand-sub">BARBEARIA</span></a>
<button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
<nav class="nav" aria-label="Navegação principal">
<a href="#servicos">Serviços</a><a href="#trabalho">Nosso Trabalho</a><a href="#equipe">Nossa Equipe</a><a href="#clientes">Clientes</a><a href="#historia">História</a>
</nav>
<a class="header-cta" href="#inicio">Agendar horário ↗</a>
</div></header>
<main>
<section class="hero" id="inicio">
<img class="hero-photo" src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=2200&q=88" alt="Interior de uma barbearia contemporânea">
<div class="hero-content"><div class="hero-kicker">Estilo, identidade e cuidado</div><h1>Muito além de <span>cabelo e barba.</span></h1><div class="hero-bottom"><p>Atendimento especializado em barbearia, com 2 unidades na região para cuidar de você.</p><a class="btn" href="#inicio">Agendar horário <span class="arrow">↗</span></a></div></div>
</section>
</main>
<script>
const menuButton=document.querySelector(".menu-toggle");
const navigation=document.querySelector(".nav");
menuButton?.addEventListener("click",()=>{
 const isOpen=menuButton.getAttribute("aria-expanded")==="true";
 menuButton.setAttribute("aria-expanded",String(!isOpen));
 menuButton.setAttribute("aria-label",isOpen?"Abrir menu":"Fechar menu");
 menuButton.textContent=isOpen?"☰":"×";
 navigation?.classList.toggle("open",!isOpen);
});
navigation?.querySelectorAll("a").forEach(link=>link.addEventListener("click",()=>{
 navigation.classList.remove("open");
 menuButton?.setAttribute("aria-expanded","false");
 menuButton?.setAttribute("aria-label","Abrir menu");
 if(menuButton)menuButton.textContent="☰";
}));
</script>
</body></html>
