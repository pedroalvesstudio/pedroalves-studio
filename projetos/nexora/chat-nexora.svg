<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="18 18 1164 864" role="img" aria-label="Interfaz de asistente de inteligencia artificial NEXORA AI en tonos índigo y violeta">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090D2A"/><stop offset=".49" stop-color="#11163E"/><stop offset="1" stop-color="#111B4F"/></linearGradient>
<radialGradient id="purple"><stop stop-color="#8F5FFF" stop-opacity=".9"/><stop offset="1" stop-color="#6B4EFF" stop-opacity="0"/></radialGradient>
<radialGradient id="blue"><stop stop-color="#446EF5" stop-opacity=".8"/><stop offset="1" stop-color="#446EF5" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#454F9B" stop-opacity=".91"/><stop offset="1" stop-color="#332273" stop-opacity=".75"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8ECFF"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="78"/></filter><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="21" flood-color="#000" flood-opacity=".24"/></filter>
<clipPath id="frame"><rect x="18" y="18" width="1164" height="864" rx="47"/></clipPath>
</defs>

<g clip-path="url(#frame)">
<rect x="18" y="18" width="1164" height="864" fill="url(#bg)"/>
<ellipse cx="1020" cy="40" rx="440" ry="310" fill="url(#purple)" opacity=".9" filter="url(#blur)"/>
<ellipse cx="40" cy="740" rx="480" ry="410" fill="url(#purple)" opacity=".95" filter="url(#blur)"/>
<ellipse cx="1160" cy="800" rx="540" ry="320" fill="url(#blue)" opacity=".85" filter="url(#blur)"/>
<path d="M-130 510C122 770 237 766 430 850" fill="none" stroke="#8F7CFF" stroke-width="5" opacity=".48" filter="url(#glow)"/>
<path d="M788 0C1025 128 1080 122 1240-75" fill="none" stroke="#A892FF" stroke-width="7" opacity=".55" filter="url(#glow)"/>
<path d="M470 866C734 693 998 718 1255 783" fill="none" stroke="#678BFF" stroke-width="5" opacity=".47" filter="url(#glow)"/>
<g font-family="Inter,Arial,sans-serif" font-size="21" font-weight="450" fill="#151C39" filter="url(#shadow)">
<rect x="142" y="108" width="499" height="118" rx="24" fill="url(#white)"/>
<text x="168" y="148"><tspan x="168">Hola, ¿podéis automatizar la atención</tspan><tspan x="168" dy="29">al cliente y los procesos de mi equipo</tspan><tspan x="168" dy="29">con inteligencia artificial?</tspan></text>
<rect x="142" y="398" width="499" height="96" rx="24" fill="url(#white)"/>
<text x="168" y="437"><tspan x="168">Perfecto. ¿Qué enfoque recomendarías</tspan><tspan x="168" dy="29">para nuestra empresa?</tspan></text>
<rect x="142" y="680" width="466" height="67" rx="22" fill="url(#white)"/>
<text x="168" y="723">Genial. ¿Cuáles son los próximos pasos?</text>
</g>
<g font-family="Inter,Arial,sans-serif" font-size="21" fill="#FAFAFF" filter="url(#shadow)">
<rect x="504" y="258" width="553" height="118" rx="26" fill="url(#glass)" stroke="#9B96F7" stroke-width="1.8"/>
<path d="M548 293l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#B4A6FF"/>
<text x="594" y="298"><tspan x="594">Claro. Un agente de IA puede organizar</tspan><tspan x="594" dy="29">solicitudes, responder consultas y</tspan><tspan x="594" dy="29">automatizar tareas repetitivas.</tspan></text>
<rect x="486" y="530" width="571" height="127" rx="26" fill="url(#glass)" stroke="#9B96F7" stroke-width="1.8"/>
<path d="M534 571l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="#B4A6FF"/>
<text x="579" y="568"><tspan x="579">Diseñamos una solución a medida:</tspan><tspan x="579" dy="29">analizamos vuestro flujo de trabajo</tspan><tspan x="579" dy="29">y priorizamos las mejoras de mayor</tspan><tspan x="579" dy="29">impacto.</tspan></text>
</g>
<rect x="100" y="782" width="1000" height="70" rx="35" fill="#12183F" fill-opacity=".76" stroke="#9F9DE9" stroke-opacity=".7" stroke-width="1.4"/>
<text x="132" y="824" font-family="Inter,Arial,sans-serif" font-size="23" fill="#C0C7E7">Escribe un mensaje...</text>
<path d="M1046 829v-26m-12 12 12-12 12 12" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

</svg>