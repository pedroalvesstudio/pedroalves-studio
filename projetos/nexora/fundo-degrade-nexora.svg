<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4E288E"/><stop offset=".31" stop-color="#1C1659"/><stop offset=".65" stop-color="#090E37"/><stop offset="1" stop-color="#050A22"/></linearGradient>
<radialGradient id="glowV"><stop stop-color="#A65CF7" stop-opacity=".93"/><stop offset=".43" stop-color="#7043E8" stop-opacity=".73"/><stop offset="1" stop-color="#7043E8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop stop-color="#A1ADFF" stop-opacity=".92"/><stop offset=".38" stop-color="#5D77F3" stop-opacity=".75"/><stop offset="1" stop-color="#334FCD" stop-opacity="0"/></radialGradient>
