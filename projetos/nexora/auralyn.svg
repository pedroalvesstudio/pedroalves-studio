<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Auralyn — caso de uso de inteligência artificial NEXORA"><defs>
<linearGradient id="base" x2="1" y2="1"><stop stop-color="#121731"/><stop offset=".4" stop-color="#272454"/><stop offset=".75" stop-color="#665482"/><stop offset="1" stop-color="#293336"/></linearGradient>
<radialGradient id="light"><stop stop-color="white" stop-opacity=".55"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="78"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".23" numOctaves="2" seed="9" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer></filter>
<filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="22" flood-color="#0A1228" flood-opacity=".15"/></filter>
</defs>
<rect width="960" height="620" fill="url(#base)"/>
<g filter="url(#soft)"><circle cx="150" cy="120" r="330" fill="#725CC5" opacity=".82"/><circle cx="790" cy="220" r="320" fill="#C1AC6B" opacity=".82"/><circle cx="630" cy="540" r="320" fill="#475274" opacity=".82"/><ellipse cx="750" cy="420" rx="230" ry="130" fill="url(#light)"/></g>
<rect width="960" height="620" filter="url(#grain)" opacity=".68"/>
<g filter="url(#shadow)"><rect x="321" y="250" width="318" height="120" rx="18" fill="white"/><text x="480" y="327" font-family="Inter,Arial,Helvetica,sans-serif" font-weight="750" font-size="58" text-anchor="middle" fill="#12151B">Auralyn</text></g>
</svg>