<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Velora — caso de uso de inteligência artificial NEXORA"><defs>
<linearGradient id="base" x2="1" y2="1"><stop stop-color="#072438"/><stop offset=".4" stop-color="#0F5D85"/><stop offset=".75" stop-color="#49B5C3"/><stop offset="1" stop-color="#132331"/></linearGradient>
<radialGradient id="light"><stop stop-color="white" stop-opacity=".55"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="78"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".23" numOctaves="2" seed="9" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer></filter>
<filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="22" flood-color="#0A1228" flood-opacity=".15"/></filter>
</defs>
<rect width="960" height="620" fill="url(#base)"/>
<g filter="url(#soft)"><circle cx="90" cy="200" r="310" fill="#61C8E7" opacity=".82"/><circle cx="820" cy="105" r="400" fill="#8DDDD7" opacity=".82"/><circle cx="640" cy="510" r="280" fill="#0A1A34" opacity=".82"/><ellipse cx="750" cy="420" rx="230" ry="130" fill="url(#light)"/></g>
<rect width="960" height="620" filter="url(#grain)" opacity=".68"/>
<g filter="url(#shadow)"><rect x="321" y="250" width="318" height="120" rx="18" fill="white"/><text x="480" y="327" font-family="Inter,Arial,Helvetica,sans-serif" font-weight="750" font-size="64" text-anchor="middle" fill="#12151B">Velora</text></g>
</svg>